<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>FEM AR Viewer – Garmin Pixel 6 Halterung</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.84);
      --border: rgba(148, 163, 184, 0.25);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    canvas {
      position: fixed; inset: 0; z-index: 1; display: block;
    }
    #hud {
      position: fixed; top: 10px; left: 10px; right: 10px;
      z-index: 20; pointer-events: none;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: flex-start;
    }
    .card {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      max-width: 330px;
      font-size: 12px;
      line-height: 1.35;
    }
    .card h1 { font-size: 14px; font-weight: 700; margin-bottom: 3px; color: #fff; }
    .meta { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      margin-top: 4px; text-align: center;
    }
    .stat { background: rgba(30, 41, 59, 0.75); border-radius: 8px; padding: 5px 4px; }
    .stat strong { display: block; font-size: 13px; color: var(--accent); }
    .stat span { font-size: 10px; color: var(--muted); }
    .controls { display: flex; flex-direction: column; gap: 7px; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      cursor: pointer; border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.85); color: var(--text);
      padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
    }
    button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    button.ar-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-color: transparent; color: #fff; width: 100%;
    }
    label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    #legend {
      position: fixed; bottom: 14px; left: 10px; z-index: 20;
      background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; width: 220px; font-size: 11px;
    }
    .colorbar { height: 10px; border-radius: 5px; margin: 5px 0 3px; }
    .colorbar-labels { display: flex; justify-content: space-between; color: var(--muted); }
    #ar-status {
      position: fixed; bottom: 14px; right: 10px; z-index: 20;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; font-size: 11px;
      max-width: 240px; display: none;
    }
    #ar-status.found { border-color: #22c55e; color: #86efac; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
  <script src="./GarminPixel6Halterung/fem_ar_data.js"></script>
</head>
<body>
  <div id="hud">
    <div class="card">
      <h1>Garmin Pixel 6 Halterung – FEM</h1>
      <div class="meta" id="meta-desc">Lade FEM-Daten...</div>
      <div class="stats">
        <div class="stat"><strong id="stat-vm">–</strong><span>Max Spannung</span></div>
        <div class="stat"><strong id="stat-disp">–</strong><span>Max Biegung</span></div>
        <div class="stat"><strong id="stat-sf">–</strong><span>Sicherheit (35 MPa)</span></div>
      </div>
    </div>

    <div class="card controls">
      <div class="btn-row">
        <button id="btn-vm" class="active">von Mises (MPa)</button>
        <button id="btn-disp">Verformung (mm)</button>
        <button id="btn-wire">Netz</button>
      </div>
      <div>
        <label><span>Verformungs-Skala</span><span id="scale-val">5.0×</span></label>
        <input id="scale-slider" type="range" min="0" max="15" step="0.5" value="5" />
      </div>
      <button id="btn-ar" class="ar-btn">AR über Zeichnung starten (HIRO-Marker)</button>
    </div>
  </div>

  <div id="legend">
    <div id="legend-title">von Mises Spannung [MPa]</div>
    <div id="colorbar" class="colorbar"></div>
    <div class="colorbar-labels">
      <span id="leg-min">0</span>
      <span id="leg-mid">–</span>
      <span id="leg-max">–</span>
    </div>
  </div>

  <div id="ar-status"></div>

  <script>
    function turboColor(t) {
      t = Math.max(0, Math.min(1, t));
      const r = Math.max(0, Math.min(1, 0.1357 + t * (4.615 + t * (-42.66 + t * (132.13 + t * (-152.94 + t * 59.28))))));
      const g = Math.max(0, Math.min(1, 0.0914 + t * (2.264 + t * (14.02 + t * (-67.45 + t * (84.66 - t * 33.41))))));
      const b = Math.max(0, Math.min(1, 0.1067 + t * (12.64 + t * (-60.58 + t * (110.36 + t * (-89.90 + t * 27.34))))));
      return [r, g, b];
    }

    function viridisColor(t) {
      t = Math.max(0, Math.min(1, t));
      const r = Math.max(0, Math.min(1, 0.267 + t * (-0.329 + t * (2.374 + t * (-1.345)))));
      const g = Math.max(0, Math.min(1, 0.004 + t * (1.425 + t * (-0.721 + t * 0.197))));
      const b = Math.max(0, Math.min(1, 0.329 + t * (1.454 + t * (-2.634 + t * 1.005))));
      return [r, g, b];
    }

    const scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.005, 50);
    camera.position.set(0.14, 0.12, 0.18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.045, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(0.5, 1.0, 0.7);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0x93c5fd, 0.45);
    dirLight2.position.set(-0.5, -0.3, -0.6);
    scene.add(dirLight2);

    const grid = new THREE.GridHelper(0.3, 15, 0x334155, 0x1e293b);
    scene.add(grid);

    const mountGroup = new THREE.Group();
    scene.add(mountGroup);

    let femData = null;
    let geometry = null;
    let wireMesh = null;
    let mode = 'vm';
    let dispScale = 5.0;

    // AR.js state
    let arActive = false;
    let arToolkitSource = null;
    let arToolkitContext = null;
    let markerRoot = null;
    let arCamera = null;

    function updateColors() {
      if (!femData || !geometry) return;
      const colors = geometry.attributes.color.array;
      const vals = mode === 'vm' ? femData.vonMises : femData.dispMag;
      const maxVal = mode === 'vm' ? femData.meta.maxVonMisesMPa : femData.meta.maxDispMm;
      const fn = mode === 'vm' ? turboColor : viridisColor;

      for (let i = 0; i < vals.length; i++) {
        const [r, g, b] = fn(vals[i] / (maxVal || 1));
        colors[i * 3] = r;
        colors[i * 3 + 1] = g;
        colors[i * 3 + 2] = b;
      }
      geometry.attributes.color.needsUpdate = true;

      const cb = document.getElementById('colorbar');
      if (mode === 'vm') {
        document.getElementById('legend-title').textContent = 'von Mises Spannung [MPa]';
        cb.style.background = 'linear-gradient(90deg, #30123b, #28bbec, #a2fc3c, #fb8022, #7a0403)';
        document.getElementById('leg-min').textContent = '0';
        document.getElementById('leg-mid').textContent = (maxVal / 2).toFixed(1);
        document.getElementById('leg-max').textContent = maxVal.toFixed(1);
      } else {
        document.getElementById('legend-title').textContent = 'Verformung [mm]';
        cb.style.background = 'linear-gradient(90deg, #440154, #31688e, #35b779, #fde725)';
        document.getElementById('leg-min').textContent = '0';
        document.getElementById('leg-mid').textContent = (maxVal / 2).toFixed(2);
        document.getElementById('leg-max').textContent = maxVal.toFixed(2);
      }
    }

    function updateDisplacement() {
      if (!femData || !geometry) return;
      const pos = geometry.attributes.position.array;
      const base = femData.positions;
      const disp = femData.displacements;
      for (let i = 0; i < pos.length; i++) {
        pos[i] = (base[i] + dispScale * disp[i]) * 0.001;
      }
      geometry.attributes.position.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    async function init() {
      if (window.FEM_AR_DATA) {
        femData = window.FEM_AR_DATA;
      } else {
        const res = await fetch('./GarminPixel6Halterung/fem_ar_data.json');
        femData = await res.json();
      }

      const m = femData.meta;
      document.getElementById('meta-desc').textContent = `${m.material} · ${m.loadCase}`;
      document.getElementById('stat-vm').textContent = `${m.maxVonMisesMPa} MPa`;
      document.getElementById('stat-disp').textContent = `${m.maxDispMm} mm`;
      document.getElementById('stat-sf').textContent = `${m.safetyFactorPetg35}×`;

      geometry = new THREE.BufferGeometry();
      const posArr = new Float32Array(femData.positions.length);
      const colArr = new Float32Array(femData.positions.length);
      geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      geometry.setIndex(femData.indices);

      updateDisplacement();
      updateColors();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.45,
        metalness: 0.05,
        side: THREE.DoubleSide,
      });
      mountGroup.add(new THREE.Mesh(geometry, mat));

      wireMesh = new THREE.Mesh(
        geometry,
        new THREE.MeshBasicMaterial({ color: 0x0f172a, wireframe: true, transparent: true, opacity: 0.2 })
      );
      wireMesh.visible = false;
      mountGroup.add(wireMesh);
    }

    function startAR() {
      arActive = true;
      grid.visible = false;
      controls.enabled = false;
      document.body.style.background = 'transparent';

      arCamera = new THREE.Camera();
      scene.add(arCamera);

      arToolkitSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
      arToolkitSource.init(() => {
        onARResize();
      }, (err) => {
        alert('Kamera-Zugriff fehlgeschlagen (HTTPS nötig): ' + err);
        stopAR();
      });

      arToolkitContext = new THREEx.ArToolkitContext({
        cameraParametersUrl: 'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/data/data/camera_para.dat',
        detectionMode: 'mono',
      });
      arToolkitContext.init(() => {
        arCamera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
      });

      markerRoot = new THREE.Group();
      scene.add(markerRoot);
      new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
        type: 'pattern',
        patternUrl: './GarminPixel6Halterung/patt.hiro',
      });

      // Scale mount nicely so it hovers clearly above the 32 mm HIRO marker (1 unit = marker width)
      scene.remove(mountGroup);
      markerRoot.add(mountGroup);
      mountGroup.scale.setScalar(18.0);
      mountGroup.position.set(0, 0.25, 0);

      const status = document.getElementById('ar-status');
      status.style.display = 'block';
      status.classList.remove('found');
      status.textContent = 'Kamera auf den HIRO-Marker auf der Zeichnung richten...';
      document.getElementById('btn-ar').textContent = 'AR beenden (zurück zu 3D)';
    }

    function stopAR() {
      arActive = false;
      if (arToolkitSource && arToolkitSource.domElement && arToolkitSource.domElement.srcObject) {
        arToolkitSource.domElement.srcObject.getTracks().forEach(t => t.stop());
      }
      if (arToolkitSource && arToolkitSource.domElement && arToolkitSource.domElement.parentNode) {
        arToolkitSource.domElement.parentNode.removeChild(arToolkitSource.domElement);
      }
      if (markerRoot) {
        markerRoot.remove(mountGroup);
        scene.remove(markerRoot);
        markerRoot = null;
      }
      if (arCamera) {
        scene.remove(arCamera);
        arCamera = null;
      }
      scene.add(mountGroup);
      mountGroup.scale.setScalar(1.0);
      mountGroup.position.set(0, 0, 0);
      grid.visible = true;
      controls.enabled = true;
      document.body.style.background = 'var(--bg)';
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('ar-status').style.display = 'none';
      document.getElementById('btn-ar').textContent = 'AR über Zeichnung starten (HIRO-Marker)';
    }

    function onARResize() {
      if (!arToolkitSource || !arToolkitSource.ready) return;
      arToolkitSource.onResizeElement();
      arToolkitSource.copyElementSizeTo(renderer.domElement);
      if (arToolkitContext && arToolkitContext.arController) {
        arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
      }
    }

    document.getElementById('btn-vm').onclick = (e) => {
      mode = 'vm';
      e.target.classList.add('active');
      document.getElementById('btn-disp').classList.remove('active');
      updateColors();
    };
    document.getElementById('btn-disp').onclick = (e) => {
      mode = 'disp';
      e.target.classList.add('active');
      document.getElementById('btn-vm').classList.remove('active');
      updateColors();
    };
    document.getElementById('btn-wire').onclick = (e) => {
      if (!wireMesh) return;
      wireMesh.visible = !wireMesh.visible;
      e.target.classList.toggle('active', wireMesh.visible);
    };
    document.getElementById('scale-slider').oninput = (e) => {
      dispScale = parseFloat(e.target.value);
      document.getElementById('scale-val').textContent = `${dispScale.toFixed(1)}×`;
      updateDisplacement();
    };
    document.getElementById('btn-ar').onclick = () => {
      if (arActive) stopAR(); else startAR();
    };

    window.addEventListener('resize', () => {
      if (arActive) {
        onARResize();
      } else {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      if (arActive) {
        if (arToolkitSource && arToolkitSource.ready && arToolkitContext) {
          arToolkitContext.update(arToolkitSource.domElement);
        }
        if (markerRoot) {
          const st = document.getElementById('ar-status');
          if (markerRoot.visible) {
            st.classList.add('found');
            st.textContent = 'Marker erkannt – FEM schwebt über Zeichnung!';
          } else {
            st.classList.remove('found');
            st.textContent = 'Kamera auf den HIRO-Marker auf der Zeichnung richten...';
          }
        }
        renderer.render(scene, arCamera);
      } else {
        controls.update();
        renderer.render(scene, camera);
      }
    }

    init();
    animate();
  </script>
</body>
</html>
