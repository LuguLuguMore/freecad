<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>FEM AR Viewer – Garmin Pixel 6 Halterung</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.86);
      --border: rgba(148, 163, 184, 0.25);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    canvas {
      position: fixed; inset: 0; z-index: 1; display: block;
    }

    /* Compact Top Bar */
    #topbar {
      position: fixed; top: 8px; left: 8px; right: 8px; z-index: 25;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 10px;
    }
    .title-wrap { min-width: 0; }
    .title-wrap h1 {
      font-size: 13px; font-weight: 700; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .title-wrap .sub {
      font-size: 11px; color: var(--accent); font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .top-btns { display: flex; gap: 5px; flex-shrink: 0; }

    button, .dl-link {
      cursor: pointer; border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.9); color: var(--text);
      padding: 6px 9px; border-radius: 7px; font-size: 11px; font-weight: 600;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    button.ar-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-color: transparent; color: #fff; padding: 9px 14px; font-size: 12px;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
    }

    /* Collapsible Drawers */
    .drawer {
      position: fixed; top: 58px; right: 8px; z-index: 24;
      width: min(290px, calc(100vw - 16px));
      background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; display: none; flex-direction: column; gap: 8px;
      font-size: 12px; max-height: calc(100vh - 130px); overflow-y: auto;
    }
    .drawer.open { display: flex; }
    .btn-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .meta-note { font-size: 11px; color: var(--muted); line-height: 1.35; }
    label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .dl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .dl-link { justify-content: center; padding: 7px 6px; }
    .dl-link:hover { border-color: var(--accent); color: var(--accent); }

    /* Compact Bottom Bar */
    #bottombar {
      position: fixed; bottom: 10px; left: 8px; right: 8px; z-index: 25;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
      pointer-events: none;
    }
    #legend {
      pointer-events: auto;
      background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 9px;
      padding: 6px 9px; width: 165px; font-size: 10px;
    }
    .colorbar { height: 8px; border-radius: 4px; margin: 4px 0 2px; }
    .colorbar-labels { display: flex; justify-content: space-between; color: var(--muted); }
    #ar-wrap {
      pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    }
    #ar-status {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 9px; font-size: 10px;
      max-width: 210px; text-align: right; display: none;
    }
    #ar-status.found { border-color: #22c55e; color: #86efac; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
  <script src="./GarminPixel6Halterung/fem_ar_data.js"></script>
</head>
<body>
  <div id="topbar">
    <div class="title-wrap">
      <h1>Pixel 6 Garmin-Mount – FEM</h1>
      <div class="sub" id="stat-line">Lade FEM-Daten...</div>
    </div>
    <div class="top-btns">
      <button id="btn-toggle-ctrl">⚙ Ansicht</button>
      <button id="btn-toggle-dl">↓ Daten</button>
    </div>
  </div>

  <div id="drawer-ctrl" class="drawer">
    <div class="meta-note" id="meta-desc"></div>
    <div class="btn-row">
      <button id="btn-vm" class="active">von Mises (MPa)</button>
      <button id="btn-disp">Verformung (mm)</button>
      <button id="btn-wire">Netz</button>
    </div>
    <div>
      <label><span>Verformungs-Skala</span><span id="scale-val">5.0×</span></label>
      <input id="scale-slider" type="range" min="0" max="15" step="0.5" value="5" />
    </div>
    <div>
      <label><span>AR-Modell-Größe</span><span id="ar-size-val">24×</span></label>
      <input id="ar-size-slider" type="range" min="8" max="60" step="2" value="24" />
    </div>
  </div>

  <div id="drawer-dl" class="drawer">
    <div class="meta-note">Projekt-Dateien herunterladen:</div>
    <div class="dl-grid">
      <a class="dl-link" href="./GarminPixel6Halterung/Zeichnung_Garmin_Pixel6_Optimiert.pdf" download>Zeichnung (PDF)</a>
      <a class="dl-link" href="./GarminPixel6Halterung/Garmin_Pixel6_Halterung_Optimiert.stl" download>3D-Druck (STL)</a>
      <a class="dl-link" href="./GarminPixel6Halterung/Garmin_Pixel6_Halterung_Optimiert.step" download>CAD (STEP)</a>
      <a class="dl-link" href="./GarminPixel6Halterung/Garmin_Pixel6_Halterung_Optimiert.FCStd" download>FreeCAD (FCStd)</a>
      <a class="dl-link" href="./GarminPixel6Halterung/Garmin_Pixel6_Halterung_FEM.FCStd" download>FEM-Projekt</a>
      <a class="dl-link" href="./GarminPixel6Halterung/Garmin_Pixel6_Baugruppe.step" download>Baugruppe (STEP)</a>
      <a class="dl-link" href="./GarminPixel6Halterung/Garmin_OutFront_Basis.stl" download>Basis-Mount (STL)</a>
      <a class="dl-link" href="./GarminPixel6Halterung/hiro_marker.png" download>HIRO-Marker</a>
    </div>
  </div>

  <div id="bottombar">
    <div id="legend">
      <div id="legend-title">von Mises [MPa]</div>
      <div id="colorbar" class="colorbar"></div>
      <div class="colorbar-labels">
        <span id="leg-min">0</span>
        <span id="leg-mid">–</span>
        <span id="leg-max">–</span>
      </div>
    </div>

    <div id="ar-wrap">
      <div id="ar-status"></div>
      <button id="btn-ar" class="ar-btn">AR starten</button>
    </div>
  </div>

  <script>
    function turboColor(t) {
      t = Math.max(0, Math.min(1, t));
      const r = Math.max(0, Math.min(1, 0.1357 + t * (4.615 + t * (-42.66 + t * (132.13 + t * (-152.94 + t * 59.28))))));
      const g = Math.max(0, Math.min(1, 0.0914 + t * (2.264 + t * (14.02 + t * (-67.45 + t * (84.66 - t * 33.41))))));
      const b = Math.max(0, Math.min(1, 0.1067 + t * (12.64 + t * (-60.58 + t * (110.36 + t * (-89.90 + t * 27.34))))));
      return [r, g, b];
    }

    function viridisColor(t) {
      t = Math.max(0, Math.min(1, t));
      const r = Math.max(0, Math.min(1, 0.267 + t * (-0.329 + t * (2.374 + t * (-1.345)))));
      const g = Math.max(0, Math.min(1, 0.004 + t * (1.425 + t * (-0.721 + t * 0.197))));
      const b = Math.max(0, Math.min(1, 0.329 + t * (1.454 + t * (-2.634 + t * 1.005))));
      return [r, g, b];
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.005, 50);
    camera.position.set(0.14, 0.12, 0.18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.045, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(0.5, 1.0, 0.7);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0x93c5fd, 0.45);
    dirLight2.position.set(-0.5, -0.3, -0.6);
    scene.add(dirLight2);

    const grid = new THREE.GridHelper(0.3, 15, 0x334155, 0x1e293b);
    scene.add(grid);

    const mountGroup = new THREE.Group();
    scene.add(mountGroup);

    let femData = null;
    let geometry = null;
    let wireMesh = null;
    let mode = 'vm';
    let dispScale = 5.0;

    let arActive = false;
    let arSize = 24.0;
    let arToolkitSource = null;
    let arToolkitContext = null;
    let markerRoot = null;
    let arCamera = null;

    function updateColors() {
      if (!femData || !geometry) return;
      const colors = geometry.attributes.color.array;
      const vals = mode === 'vm' ? femData.vonMises : femData.dispMag;
      const maxVal = mode === 'vm' ? femData.meta.maxVonMisesMPa : femData.meta.maxDispMm;
      const fn = mode === 'vm' ? turboColor : viridisColor;

      for (let i = 0; i < vals.length; i++) {
        const [r, g, b] = fn(vals[i] / (maxVal || 1));
        colors[i * 3] = r;
        colors[i * 3 + 1] = g;
        colors[i * 3 + 2] = b;
      }
      geometry.attributes.color.needsUpdate = true;

      const cb = document.getElementById('colorbar');
      if (mode === 'vm') {
        document.getElementById('legend-title').textContent = 'von Mises [MPa]';
        cb.style.background = 'linear-gradient(90deg, #30123b, #28bbec, #a2fc3c, #fb8022, #7a0403)';
        document.getElementById('leg-min').textContent = '0';
        document.getElementById('leg-mid').textContent = (maxVal / 2).toFixed(1);
        document.getElementById('leg-max').textContent = maxVal.toFixed(1);
      } else {
        document.getElementById('legend-title').textContent = 'Verformung [mm]';
        cb.style.background = 'linear-gradient(90deg, #440154, #31688e, #35b779, #fde725)';
        document.getElementById('leg-min').textContent = '0';
        document.getElementById('leg-mid').textContent = (maxVal / 2).toFixed(2);
        document.getElementById('leg-max').textContent = maxVal.toFixed(2);
      }
    }

    function updateDisplacement() {
      if (!femData || !geometry) return;
      const pos = geometry.attributes.position.array;
      const base = femData.positions;
      const disp = femData.displacements;
      for (let i = 0; i < pos.length; i++) {
        pos[i] = (base[i] + dispScale * disp[i]) * 0.001;
      }
      geometry.attributes.position.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    async function init() {
      if (window.FEM_AR_DATA) {
        femData = window.FEM_AR_DATA;
      } else {
        const res = await fetch('./GarminPixel6Halterung/fem_ar_data.json');
        femData = await res.json();
      }

      const m = femData.meta;
      document.getElementById('stat-line').textContent =
        `Max ${m.maxVonMisesMPa} MPa · ${m.maxDispMm} mm · SF ${m.safetyFactorPetg35}×`;
      document.getElementById('meta-desc').textContent = `${m.material} · ${m.loadCase}`;

      geometry = new THREE.BufferGeometry();
      const posArr = new Float32Array(femData.positions.length);
      const colArr = new Float32Array(femData.positions.length);
      geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      geometry.setIndex(femData.indices);

      updateDisplacement();
      updateColors();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.45,
        metalness: 0.05,
        side: THREE.DoubleSide,
      });
      mountGroup.add(new THREE.Mesh(geometry, mat));

      wireMesh = new THREE.Mesh(
        geometry,
        new THREE.MeshBasicMaterial({ color: 0x0f172a, wireframe: true, transparent: true, opacity: 0.2 })
      );
      wireMesh.visible = false;
      mountGroup.add(wireMesh);
    }

    function startAR() {
      arActive = true;
      grid.visible = false;
      controls.enabled = false;
      document.body.style.background = 'transparent';
      document.getElementById('drawer-ctrl').classList.remove('open');
      document.getElementById('drawer-dl').classList.remove('open');

      arCamera = new THREE.Camera();
      scene.add(arCamera);

      arToolkitSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
      arToolkitSource.init(() => {
        onARResize();
      }, (err) => {
        alert('Kamera-Zugriff fehlgeschlagen (HTTPS nötig): ' + err);
        stopAR();
      });

      arToolkitContext = new THREEx.ArToolkitContext({
        cameraParametersUrl: 'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/data/data/camera_para.dat',
        detectionMode: 'mono',
      });
      arToolkitContext.init(() => {
        arCamera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
      });

      markerRoot = new THREE.Group();
      scene.add(markerRoot);
      new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
        type: 'pattern',
        patternUrl: './GarminPixel6Halterung/patt.hiro',
      });

      scene.remove(mountGroup);
      markerRoot.add(mountGroup);
      mountGroup.scale.setScalar(arSize);
      mountGroup.position.set(0, 0.25, 0);
      mountGroup.rotation.set(0, 0, 0);

      const status = document.getElementById('ar-status');
      status.style.display = 'block';
      status.classList.remove('found');
      status.textContent = 'Auf HIRO-Marker richten...';
      document.getElementById('btn-ar').textContent = 'AR beenden';
    }

    function stopAR() {
      arActive = false;
      if (arToolkitSource && arToolkitSource.domElement && arToolkitSource.domElement.srcObject) {
        arToolkitSource.domElement.srcObject.getTracks().forEach(t => t.stop());
      }
      if (arToolkitSource && arToolkitSource.domElement && arToolkitSource.domElement.parentNode) {
        arToolkitSource.domElement.parentNode.removeChild(arToolkitSource.domElement);
      }
      if (markerRoot) {
        markerRoot.remove(mountGroup);
        scene.remove(markerRoot);
        markerRoot = null;
      }
      if (arCamera) {
        scene.remove(arCamera);
        arCamera = null;
      }
      scene.add(mountGroup);
      mountGroup.scale.setScalar(1.0);
      mountGroup.position.set(0, 0, 0);
      mountGroup.rotation.set(0, 0, 0);
      grid.visible = true;
      controls.enabled = true;
      document.body.style.background = 'var(--bg)';
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('ar-status').style.display = 'none';
      document.getElementById('btn-ar').textContent = 'AR starten';
    }

    function onARResize() {
      if (!arToolkitSource || !arToolkitSource.ready) return;
      arToolkitSource.onResizeElement();
      arToolkitSource.copyElementSizeTo(renderer.domElement);
      if (arToolkitContext && arToolkitContext.arController) {
        arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
      }
    }

    // Drawer toggles
    const dCtrl = document.getElementById('drawer-ctrl');
    const dDl = document.getElementById('drawer-dl');
    document.getElementById('btn-toggle-ctrl').onclick = () => {
      dDl.classList.remove('open');
      dCtrl.classList.toggle('open');
    };
    document.getElementById('btn-toggle-dl').onclick = () => {
      dCtrl.classList.remove('open');
      dDl.classList.toggle('open');
    };

    document.getElementById('btn-vm').onclick = (e) => {
      mode = 'vm';
      e.target.classList.add('active');
      document.getElementById('btn-disp').classList.remove('active');
      updateColors();
    };
    document.getElementById('btn-disp').onclick = (e) => {
      mode = 'disp';
      e.target.classList.add('active');
      document.getElementById('btn-vm').classList.remove('active');
      updateColors();
    };
    document.getElementById('btn-wire').onclick = (e) => {
      if (!wireMesh) return;
      wireMesh.visible = !wireMesh.visible;
      e.target.classList.toggle('active', wireMesh.visible);
    };
    document.getElementById('scale-slider').oninput = (e) => {
      dispScale = parseFloat(e.target.value);
      document.getElementById('scale-val').textContent = `${dispScale.toFixed(1)}×`;
      updateDisplacement();
    };
    document.getElementById('ar-size-slider').oninput = (e) => {
      arSize = parseFloat(e.target.value);
      document.getElementById('ar-size-val').textContent = `${arSize}×`;
      if (arActive) mountGroup.scale.setScalar(arSize);
    };

    // Touch gestures in AR mode: 1-finger rotate, 2-finger pinch-to-zoom
    let lastTouchX = 0, lastTouchY = 0, lastPinchDist = 0;
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (!arActive) return;
      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });
    renderer.domElement.addEventListener('touchmove', (e) => {
      if (!arActive) return;
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        mountGroup.rotation.y += dx * 0.01;
        mountGroup.rotation.x += dy * 0.01;
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (lastPinchDist > 0) {
          arSize = Math.max(6, Math.min(80, arSize * (dist / lastPinchDist)));
          mountGroup.scale.setScalar(arSize);
          document.getElementById('ar-size-slider').value = Math.round(arSize);
          document.getElementById('ar-size-val').textContent = `${Math.round(arSize)}×`;
        }
        lastPinchDist = dist;
      }
    }, { passive: true });
    document.getElementById('btn-ar').onclick = () => {
      if (arActive) stopAR(); else startAR();
    };

    window.addEventListener('resize', () => {
      if (arActive) {
        onARResize();
      } else {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      if (arActive) {
        if (arToolkitSource && arToolkitSource.ready && arToolkitContext) {
          arToolkitContext.update(arToolkitSource.domElement);
        }
        if (markerRoot) {
          const st = document.getElementById('ar-status');
          if (markerRoot.visible) {
            st.classList.add('found');
            st.textContent = 'Marker erkannt – FEM aktiv!';
          } else {
            st.classList.remove('found');
            st.textContent = 'Auf HIRO-Marker richten...';
          }
        }
        renderer.render(scene, arCamera);
      } else {
        controls.update();
        renderer.render(scene, camera);
      }
    }

    init();
    animate();
  </script>
</body>
</html>
